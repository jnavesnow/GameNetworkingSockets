name: Build Android Only (v1.6.1)
on: [workflow_dispatch]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: ValveSoftware/GameNetworkingSockets
        ref: v1.6.1
        submodules: recursive

    - name: Install System Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake protobuf-compiler libprotobuf-dev autoconf automake libtool autoconf-archive

    - name: Setup VCPKG and Build Only Sodium
      run: |
        HOST_URL="https://github.com"
        REPO_PATH="/microsoft/vcpkg.git"
        git clone "${HOST_URL}${REPO_PATH}" google-vcpkg
        cd google-vcpkg
        ./bootstrap-vcpkg.sh -disableMetrics
        rm -f ../vcpkg.json
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        ./vcpkg install libsodium --triplet=arm64-android
        cd ..

    - name: 🪚 Patch Valve CMakeLists (Remove Pedantic Check)
      run: |
        SODIUM_ROOT="${{ github.workspace }}/google-vcpkg/installed/arm64-android"
        
        echo "=== Rewriting Valve's CMake file to inject explicit paths ==="
        # Comment out the problematic find_package(sodium) call entirely
        sed -i 's/find_package(sodium REQUIRED)/# Removed pedantic check/g' CMakeLists.txt
        
        # Force add the include and library paths to the very top of the CMake structure
        echo "include_directories(\"${SODIUM_ROOT}/include\")" > CMakeLists.tmp
        echo "link_libraries(\"${SODIUM_ROOT}/lib/libsodium.a\")" >> CMakeLists.tmp
        cat CMakeLists.txt >> CMakeLists.tmp
        mv CMakeLists.tmp CMakeLists.txt
        
        echo "=== Top 15 lines of modified CMakeLists.txt ==="
        head -n 15 CMakeLists.txt

    - name: 🚀 Compile GameNetworkingSockets
      run: |
        cmake -S . -B build_dir -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DUSE_CRYPTO=libsodium \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF
            
        cmake --build build_dir --config Release
        ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug build_dir/bin/libgamenetworkingsockets.so

    - name: Upload Finished Android arm64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: stripped-android-arm64
        path: build_dir/bin/libgamenetworkingsockets.so
