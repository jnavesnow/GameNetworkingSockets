name: Build Android Only (v1.6.1)
on: [workflow_dispatch]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: ValveSoftware/GameNetworkingSockets
        ref: v1.6.1
        submodules: recursive

    - name: Install System Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake protobuf-compiler libprotobuf-dev autoconf automake libtool autoconf-archive

    - name: Setup VCPKG and Cross-Compile Dependencies
      run: |
        HOST_URL="https://github.com"
        REPO_PATH="/microsoft/vcpkg.git"
        
        git clone "${HOST_URL}${REPO_PATH}" google-vcpkg
        cd google-vcpkg
        ./bootstrap-vcpkg.sh -disableMetrics
        rm -f ../vcpkg.json
        
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        ./vcpkg install openssl --triplet=arm64-android
        cd ..

    - name: 🪚 Patch Valve CMakeLists (Bypass All Check Projects)
      run: |
        OPENSSL_ROOT="${{ github.workspace }}/google-vcpkg/installed/arm64-android"
        
        echo "=== [Safety Pass] Stripping check_symbol_exists macros ==="
        # 1. Comment out the broken search mechanisms
        sed -i 's/find_package(OpenSSL REQUIRED)/# Removed broken block/g' CMakeLists.txt
        
        # 2. Bypass the try_compile check at line 148 by force-defining the result flag variable
        sed -i 's/check_symbol_exists(EVP_MD_CTX_free/#/g' CMakeLists.txt
        sed -i 's/if ( NOT HAVE_EVP_MD_CTX_FREE )/if(FALSE)/g' CMakeLists.txt
        
        # 3. Hard-inject paths and variables right to the top of the file layout
        echo "set(HAVE_EVP_MD_CTX_FREE 1)" > CMakeLists.tmp
        echo "set(OPENSSL_FOUND TRUE)" >> CMakeLists.tmp
        echo "include_directories(\"${OPENSSL_ROOT}/include\")" >> CMakeLists.tmp
        echo "link_libraries(\"${OPENSSL_ROOT}/lib/libssl.a\" \"${OPENSSL_ROOT}/lib/libcrypto.a\" -ldl -lm)" >> CMakeLists.tmp
        cat CMakeLists.txt >> CMakeLists.tmp
        mv CMakeLists.tmp CMakeLists.txt
        
        echo "=== Top 20 lines of modified CMakeLists.txt ==="
        head -n 20 CMakeLists.txt

    - name: 🚀 Compile GameNetworkingSockets for Android arm64-v8a
      run: |
        cmake -S . -B build_dir -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DUSE_CRYPTO=OpenSSL \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF
            
        cmake --build build_dir --config Release
        
        # Clean up binary overhead and strip debug data structures
        ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug build_dir/bin/libgamenetworkingsockets.so

    - name: Upload Finished Android arm64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: stripped-android-arm64
        path: build_dir/bin/libgamenetworkingsockets.so
