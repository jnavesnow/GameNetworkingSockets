name: Build Android Only (v1.6.1)
on: [workflow_dispatch]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: ValveSoftware/GameNetworkingSockets
        ref: v1.6.1
        submodules: recursive

    - name: Install System Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake protobuf-compiler libprotobuf-dev autoconf automake libtool autoconf-archive

    - name: Setup VCPKG and Cross-Compile Dependencies
      run: |
        HOST_URL="https://github.com"
        REPO_PATH="/microsoft/vcpkg.git"
        
        git clone "${HOST_URL}${REPO_PATH}" google-vcpkg
        cd google-vcpkg
        ./bootstrap-vcpkg.sh -disableMetrics
        rm -f ../vcpkg.json
        
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        ./vcpkg install openssl --triplet=arm64-android
        cd ..

    - name: 🚀 Compile GameNetworkingSockets for Android arm64-v8a
      run: |
        # Injecting OpenSSL static verification flags and native Android system library links
        cmake -S . -B build_dir -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/google-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DUSE_CRYPTO=OpenSSL \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DCMAKE_CXX_STANDARD_LIBRARIES="-ldl -lm" \
            -DCMAKE_C_STANDARD_LIBRARIES="-ldl -lm" \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF
            
        cmake --build build_dir --config Release
        
        # Clean up binary overhead and strip debug data structures
        ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug build_dir/bin/libgamenetworkingsockets.so

    - name: Upload Finished Android arm64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: stripped-android-arm64
        path: build_dir/bin/libgamenetworkingsockets.so
