name: Build Android Only (v1.6.1)
on: [workflow_dispatch]

jobs:
  build-android-arm64:
    runs-on: macos-latest # Using macOS because Valve's script relies on macOS/Xcode SDK matching environments for their unified script setups
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: brew install ninja protobuf cmake

    - name: Compile Prerequisites and GameNetworkingSockets
      run: |
        # 1. Execute Valve's official script that handles Android OpenSSL cross-compilation internally
        ./cmake/apple/build-apple-deps.sh --android-arm64
        
        # 2. Force the standard build with SDR/Protobuf disabled for your dynamic library pass
        cmake -S . -B build_dir -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF \
            -DOPENSSL_ROOT_DIR="$(pwd)/build/apple-deps/android-arm64"
            
        cmake --build build_dir --config Release

    - name: Upload Finished Android arm64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: stripped-android-arm64
        path: build_dir/bin/libgamenetworkingsockets.so
