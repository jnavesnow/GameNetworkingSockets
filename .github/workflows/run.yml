name: Build Android Only (v1.6.1)
on: [workflow_dispatch]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout GameNetworkingSockets Source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake protobuf-compiler libprotobuf-dev

    - name: Clone and Compile Official Libsodium for Android
      run: |
        # 1. Download official libsodium source
        git clone https://github.com --branch 1.0.19 libsodium-src
        
        # 2. Cross-compile libsodium natively using the Android NDK Toolchain
        cmake -S libsodium-src -B build_sodium -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DED25519=ON
        cmake --build build_sodium --config Release
        
        # 3. Create a pristine target folder layout for CMake's Findsodium parser
        mkdir -p ${{ github.workspace }}/sodium_install/include
        mkdir -p ${{ github.workspace }}/sodium_install/lib
        cp -r libsodium-src/src/libsodium/include/* ${{ github.workspace }}/sodium_install/include/
        cp build_sodium/libsodium.a ${{ github.workspace }}/sodium_install/lib/

    - name: Compile GameNetworkingSockets for Android arm64-v8a
      run: |
        # 4. Compile with Protobuf/SDR disabled and feed the custom sodium directory link
        cmake -S . -B build_android_arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DUSE_CRYPTO=libsodium \
            -Dsodium_USE_STATIC_LIBS=ON \
            -Dsodium_DIR="${{ github.workspace }}/sodium_install" \
            -Dsodium_INCLUDE_DIR="${{ github.workspace }}/sodium_install/include" \
            -Dsodium_LIBRARY_RELEASE="${{ github.workspace }}/sodium_install/lib/libsodium.a" \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF
        cmake --build build_android_arm64 --config Release
        
        # 5. Strip any leftover debug symbols to make the binary lightweight
        ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug build_android_arm64/bin/libgamenetworkingsockets.so

    - name: Upload Finished Android arm64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: stripped-android-arm64
        path: build_android_arm64/bin/libgamenetworkingsockets.so
