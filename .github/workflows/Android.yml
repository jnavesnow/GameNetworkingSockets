name: Build Android Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Use Valve's explicitly mapped architecture targets
        preset: [android-arm64, android-arm, android-x86_64, android-x86]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Critical for compiling Valve's internal sub-dependencies

    - name: Setup Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Toolchain
      uses: android-actions/setup-android@v3
      id: android-env

    - name: Install Correct Android NDK Tool Version
      run: |
        # Use NDK r25/r26 versions which natively mirror Valve's modern Bionic integrations
        sdkmanager "ndk;25.2.9519653"

    - name: Install Toolchain Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build openssl libssl-dev

    - name: Configure via Valve's Android Preset
      env:
        # Connects your environment directly to CMakePresets.json expectations
        ANDROID_NDK_HOME: ${{ steps.android-env.outputs.sdk-path }}/ndk/25.2.9519653
      run: |
        cmake --preset ${{ matrix.preset }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DPROTECT_SIDE_CHANNELS=OFF

    - name: Build Library Production Binaries
      run: |
        # Triggers the exact compilation sequence outlined in the repository documentation
        cmake --build --preset ${{ matrix.preset }} --config Release

    - name: Archive Production Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gamenetworkingsockets-${{ matrix.preset }}-release
        path: |
          build/${{ matrix.preset }}/**/*.so
          build/${{ matrix.preset }}/**/*.a
