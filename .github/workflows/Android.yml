name: Build Android All-In-One Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-bundle:
    runs-on: ubuntu-latest

    env:
      CI_BUILD: 1
      IMAGE: ubuntu

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Nuclear Clean Leftover Caches
      run: |
        rm -rf build build-android-arm64 vcpkg_installed .vcpkg-root CMakeCache.txt CMakeFiles/

    - name: Run Valve Official Package Preparation
      run: |
        sudo -E bash .github/update-packages.sh

    - name: Run Valve Official Dependency Provisioning
      run: |
        sudo -E bash .github/install.sh

    - name: Cross-Compile Manifest Dependencies for Android
      run: |
        vcpkg install --triplet=arm64-android --x-manifest-root=${{ github.workspace }}

    - name: Configure GameNetworkingSockets Engine
      run: |
        # FIXED: Added -DCMAKE_REQUIRED_LIBRARIES=log to provide required Android systems to internal checks
        cmake -B build-android-arm64 -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=/usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=arm64-android \
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DPROTECT_SIDE_CHANNELS=OFF \
          -DGameNetworkingSockets_STATIC_LINK_openssl=ON \
          -DCMAKE_REQUIRED_LIBRARIES=log

    - name: Compile Libraries
      run: |
        cmake --build build-android-arm64 --config Release

    - name: Consolidate Output Files for Android Studio
      run: |
        mkdir -p distribution/arm64-v8a
        find build-android-arm64 -name "libGameNetworkingSockets.so" -exec cp {} distribution/arm64-v8a/ \;
        find build-android-arm64/vcpkg_installed/arm64-android -name "*.so" -exec cp {} distribution/arm64-v8a/ \;

    - name: Upload Ready-To-Link Package
      uses: actions/upload-artifact@v4
      with:
        name: gamenetworkingsockets-android-all-in-one
        path: distribution/
        
