name: Build Android Libraries

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-android:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Build for all standard modern Android architectures
        abi: [arm64-v8a, armeabi-v7a, x86_64]
        include:
          - abi: arm64-v8a
            api_level: 21
          - abi: armeabi-v7a
            api_level: 21
          - abi: x86_64
            api_level: 21

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Ensures Protobuf or other internal dependencies pull down

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      id: setup-android
      # This action automatically setups the SDK and drops an NDK ready for use

    - name: Install NDK Component
      run: |
        sdkmanager "ndk;25.2.9519653" # Adjust NDK version if your codebase targets a specific one

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build ninja-build openssl libssl-dev

    - name: Configure CMake for Android
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/25.2.9519653
      run: |
        cmake -B build-${{ matrix.abi }} \
          -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-${{ matrix.api_level }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DPROTECT_SIDE_CHANNELS=OFF

    - name: Build Libraries
      run: |
        cmake --build build-${{ matrix.abi }} --config Release

    - name: Upload Android Binaries Artifacts
      uses: actions/artifacts/upload-artifact@v4
      with:
        name: gamenetworkingsockets-android-${{ matrix.abi }}
        path: |
          build-${{ matrix.abi }}/**/*.so
          build-${{ matrix.abi }}/**/*.a
