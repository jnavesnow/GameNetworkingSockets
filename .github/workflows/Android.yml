name: Build Android All-In-One Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-bundle:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build zip unzip curl

    - name: Install vcpkg Natively
      run: |
        git clone https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg-engine
        $GITHUB_WORKSPACE/vcpkg-engine/bootstrap-vcpkg.sh

    - name: Build Core Dependencies for Android
      env:
        VCPKG_ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      run: |
        $GITHUB_WORKSPACE/vcpkg-engine/vcpkg install openssl protobuf --triplet=arm64-android

    - name: Configure GameNetworkingSockets
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      run: |
        cmake --preset android-arm64 \
          -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-engine/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=arm64-android \
          -DCMAKE_BUILD_TYPE=Release \
          -DPROTECT_SIDE_CHANNELS=OFF

    - name: Compile Libraries
      run: |
        cmake --build --preset android-arm64 --config Release

    - name: Consolidate Output Files for Android Studio
      run: |
        mkdir -p distribution/arm64-v8a
        find build/android-arm64 -name "libGameNetworkingSockets.so" -exec cp {} distribution/arm64-v8a/ \;
        find $GITHUB_WORKSPACE/vcpkg-engine/packages/openssl_arm64-android -name "*.so" -exec cp {} distribution/arm64-v8a/ \;
        find $GITHUB_WORKSPACE/vcpkg-engine/packages/protobuf_arm64-android -name "*.so" -exec cp {} distribution/arm64-v8a/ \;

    - name: Upload Ready-To-Link Package
      uses: actions/upload-artifact@v4
      with:
        name: gamenetworkingsockets-android-all-in-one
        path: distribution/
        
