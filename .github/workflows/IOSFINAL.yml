name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Open a tmate SSH debug session after the build/test steps, even on success'
        type: boolean
        default: false

jobs:

  build-and-test-ios:
    name: Build And Test iOS (simulator)
    runs-on: macos-latest

    # REQUIRED: Grants the GitHub token permissions to create releases and upload files
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        # REQUIRED FOR CROSS-COMPATIBILITY: Ensures internal dependency code is pulled down
        submodules: recursive

    - name: Install Homebrew dependencies
      run: brew install ninja protobuf

    - name: Cache Apple dependency builds (OpenSSL, protobuf/Abseil for iOS)
      uses: actions/cache@v4
      with:
        path: build/apple-deps
        key: apple-deps-ios-${{ hashFiles('cmake/apple/build-apple-deps.sh') }}

    - name: Build xcframework
      run: ./cmake/apple/make-xcframework.sh --with-deps

    - name: Run iOS simulator smoke test
      run: ./cmake/apple/run-ios-smoke-test.sh

    # =========================================================================
    # ADDED: Safe artifact grouping to package everything you need for Xcode
    # =========================================================================
    - name: Consolidate Output Files for Xcode Studio
      run: |
        mkdir -p distribution/ios
        # Copies the self-contained framework containing both core code and sub-dependencies
        cp -R build/GameNetworkingSockets.xcframework distribution/ios/

    - name: Package Output for Release Delivery
      run: |
        # Zips up the framework folder structure so it can be safely uploaded to GitHub Releases
        cd distribution
        zip -r ../gamenetworkingsockets-ios.zip ios/

    - name: Automatically Create GitHub Release and Upload Binaries
      uses: softprops/action-gh-release@v2
      with:
        # Generates a clear, unique release tag using the short commit hash to match your Android layout
        tag_name: ios-build-${{ github.sha }}
        name: GameNetworkingSockets iOS Production Release
        body: |
          Automated Apple iOS framework compile.
          - Output: GameNetworkingSockets.xcframework (Device & Simulator bundles)
          - Dependencies: Monolithically integrated static OpenSSL and Protobuf assets matching the Android protocol footprint.
        draft: false
        prerelease: false
        files: |
          gamenetworkingsockets-ios.zip
