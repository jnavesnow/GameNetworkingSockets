name: Windows

on: [push, pull_request, workflow_dispatch]

jobs:

  build-and-test-windows:
    name: Windows Server ${{ matrix.os-version }} OpenSSL x64
    runs-on: windows-${{ matrix.os-version }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned strictly to modern stable Windows Server architectures and OpenSSL
        os-version: [2022, 2025]

    # REQUIRED: Grants the GitHub token permissions to create releases and upload files
    permissions:
      contents: write

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup mock IPs
        run: py -3 tests/test_p2p.py --setup-mock-ips
        shell: cmd

      - name: Configure Git
        run: git config --global --add safe.directory '*'
        shell: cmd

      - uses: lukka/get-cmake@latest

      - uses: ilammy/msvc-dev-cmd@v1

      - name: set VCPKG_ROOT
        run: |
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Setup local vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          cd /d "${{ env.VCPKG_ROOT }}"
          git checkout 522253caf47268c1724f486a035e927a42a90092
          call bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Ensure vcpkg cache directories exist
        run: |
          New-Item -ItemType Directory -Path "${{ env.VCPKG_ROOT }}/downloads" -Force | Out-Null
          New-Item -ItemType Directory -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" -Force | Out-Null
        shell: pwsh

      - name: Restore vcpkg caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.os-version }}-OpenSSL-${{ env.VCToolsVersion }}-522253caf47268c1724f486a035e927a42a90092-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.os-version }}-OpenSSL-${{ env.VCToolsVersion }}-
            vcpkg-${{ runner.os }}-${{ matrix.os-version }}-OpenSSL-

      - name: vcpkg check / install dependencies
        working-directory: '${{ github.workspace }}'
        run: '"${{env.VCPKG_ROOT}}\vcpkg" install --vcpkg-root "${{env.VCPKG_ROOT}}" --triplet=x64-windows'
        shell: cmd

      - name: Configure CMake (RelWithDebInfo)
        run: |
          mkdir build
          cd build
          cmake -S .. -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DBUILD_TOOLS=ON "-DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake" -DUSE_CRYPTO=OpenSSL
        shell: cmd

      - name: Build (RelWithDebInfo)
        working-directory: '${{ github.workspace }}/build'
        run: ninja
        shell: cmd

      - name: Test crypto
        working-directory: '${{ github.workspace }}/build/bin'
        run: test_crypto.exe
        shell: cmd

      - name: Test connection
        working-directory: '${{ github.workspace }}/build/bin'
        run: test_connection.exe suite-quick
        shell: cmd

      - name: Test p2p
        working-directory: '${{ github.workspace }}/build/bin'
        run: py -3 test_p2p.py --spewlevel=debug --loglevel-p2prendezvous=debug
        shell: cmd

      - name: Configure CMake (Release)
        run: |
          mkdir build-release
          cd build-release
          cmake -S .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DBUILD_TOOLS=ON "-DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake" -DUSE_CRYPTO=OpenSSL
        shell: cmd

      - name: Build (Release)
        working-directory: '${{ github.workspace }}/build-release'
        run: ninja
        shell: cmd

      - name: Configure CMake (Debug)
        run: |
          mkdir build-debug
          cd build-debug
          cmake -S .. -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DBUILD_TOOLS=ON "-DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake" -DUSE_CRYPTO=OpenSSL
        shell: cmd

      - name: Build (Debug)
        working-directory: '${{ github.workspace }}/build-debug'
        run: ninja
        shell: cmd

      # =========================================================================
      # ADDED: Package everything needed for compilation and runtime linking
      # =========================================================================
      - name: Consolidate Output Files for Windows Deployment
        run: |
          mkdir "${{ github.workspace }}\distribution"
          mkdir "${{ github.workspace }}\distribution\x64"
          
          # 1. Gather core Release runtime engines and link libraries (.dll and .lib)
          copy "${{ github.workspace }}\build-release\bin\GameNetworkingSockets.dll" "${{ github.workspace }}\distribution\x64\"
          copy "${{ github.workspace }}\build-release\bin\GameNetworkingSockets.lib" "${{ github.workspace }}\distribution\x64\"
          
          # 2. Extract companion cross-compiled dependent runtime dlls from vcpkg package trees
          # This copies the exact matching libprotobuf.dll, libcrypto-3-x64.dll, and libssl-3-x64.dll
          for /r "${{ github.workspace }}\vcpkg\packages" %%f in (*.dll) do copy "%%f" "${{ github.workspace }}\distribution\x64\"
        shell: cmd

      - name: Package Output for Release Delivery
        run: |
          # Uses native PowerShell compression to securely bundle the x64 assets into a zip archive
          Compress-Archive -Path "${{ github.workspace }}\distribution\x64" -DestinationPath "${{ github.workspace }}\gamenetworkingsockets-windows-x64-server${{ matrix.os-version }}.zip" -Force
        shell: pwsh

      - name: Automatically Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          # Generates a clear, unique release tag matching your Android and iOS layout patterns
          tag_name: windows-build-server${{ matrix.os-version }}-${{ github.sha }}
          name: GameNetworkingSockets Windows Server ${{ matrix.os-version }} Release
          body: |
            Automated Windows x64 PC desktop framework compile.
            - Runner OS Host: Windows Server ${{ matrix.os-version }}
            - Core Engine: GameNetworkingSockets.dll with matching companion reference mapping .lib files.
            - Dependencies: Fully dynamic runtime OpenSSL 3.x and Protobuf modules aligned with your mobile client signatures.
          draft: false
          prerelease: false
          files: |
            gamenetworkingsockets-windows-x64-server${{ matrix.os-version }}.zip
