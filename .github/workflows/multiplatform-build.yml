name: Build All Platforms (v1.6.1)
on: [workflow_dispatch]

jobs:
  # ----------------------------------------------------
  # 1. ANDROID ARM64 BUILD
  # ----------------------------------------------------
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: ValveSoftware/GameNetworkingSockets
        ref: v1.6.1
        submodules: recursive

    - name: Set up Native Android NDK
      uses: android-actions/setup-android@v3

    - name: Install System Dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

    - name: Compile Android arm64-v8a
      run: |
        cmake -H. -Bbuild_arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF
        cmake --build build_arm64 --config Release

    - name: Upload Android arm64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: stripped-android-arm64
        path: build_arm64/bin/libgamenetworkingsockets.so

  # ----------------------------------------------------
  # 2. APPLE JOB (iOS & macOS)
  # ----------------------------------------------------
  build-apple:
    runs-on: macos-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: ValveSoftware/GameNetworkingSockets
        ref: v1.6.1
        submodules: recursive

    - name: Install Mac Dependencies
      run: brew install openssl@3 ninja cmake

    - name: Compile macOS (.dylib)
      run: |
        cmake -H. -Bbuild_mac -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
        cmake --build build_mac --config Release

    - name: Compile iOS Framework
      run: |
        cmake -H. -Bbuild_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
        cmake --build build_ios --config Release

    - name: Upload Apple Binaries
      uses: actions/upload-artifact@v4
      with:
        name: stripped-apple-platforms
        path: |
          build_mac/bin/libgamenetworkingsockets.dylib
          build_ios/bin/libgamenetworkingsockets.dylib

  # ----------------------------------------------------
  # 3. WINDOWS JOB (PC .dll)
  # ----------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: ValveSoftware/GameNetworkingSockets
        ref: v1.6.1
        submodules: recursive

    - name: Setup Windows Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Dependencies via vcpkg
      run: |
        git clone https://github.com
        cd vcpkg
        .\bootstrap-vcpkg.bat
        .\vcpkg install openssl:x64-windows
        cd ..

    - name: Compile Windows PC Library
      run: |
        cmake -H. -Bbuild_win -G Ninja -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DENABLE_STEAMDATAGRAMRELAY=OFF -DENABLE_ICE=ON -DENABLE_TESTS=OFF -DENABLE_EXAMPLES=OFF
        cmake --build build_win --config Release

    - name: Upload Windows Binary
      uses: actions/upload-artifact@v4
      with:
        name: stripped-windows-pc
        path: |
          build_win/bin/gamenetworkingsockets.dll
          build_win/bin/gamenetworkingsockets.lib
