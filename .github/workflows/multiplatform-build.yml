name: Build Stripped Multiplatform Binaries
on: [workflow_dispatch]

jobs:
  # ----------------------------------------------------
  # 1. ANDROID TARGET (Ubuntu Virtual Machine)
  # ----------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake protobuf-compiler libprotobuf-dev

    - name: Compile Android arm64-v8a
      run: |
        cmake -S . -B build_android_arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_STEAMDATAGRAMRELAY=OFF \
            -DENABLE_ICE=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF
        cmake --build build_android_arm64 --config Release
        ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug build_android_arm64/bin/libgamenetworkingsockets.so

    - name: Upload Android arm64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: android-arm64-v8a
        path: build_android_arm64/bin/libgamenetworkingsockets.so

  # ----------------------------------------------------
  # 2. IOS TARGET (Apple macOS Virtual Machine)
  # ----------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Homebrew dependencies
      run: brew install ninja protobuf

    - name: Cache Apple dependency builds
      uses: actions/cache@v4
      with:
        path: build/apple-deps
        key: apple-deps-ios-${{ hashFiles('cmake/apple/build-apple-deps.sh') }}

    - name: Patch & Build xcframework (No Steam Relay / No Protobuf)
      run: |
        # Inject the custom configuration switches directly into Valve's shell builder
        export CMAKE_ARGS="-DENABLE_STEAMDATAGRAMRELAY=OFF -DENABLE_ICE=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF"
        ./cmake/apple/make-xcframework.sh --with-deps

    - name: Upload Apple iOS Binary
      uses: actions/upload-artifact@v4
      with:
        name: ios-framework
        path: build/apple/GameNetworkingSockets.xcframework/

  # ----------------------------------------------------
  # 3. WINDOWS TARGET (Windows Server Virtual Machine)
  # ----------------------------------------------------
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Safe Directories
        run: git config --global --add safe.directory '*'
        shell: cmd

      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Initialize VCPKG Path
        run: |
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Setup Valve's Explicit VCPKG Pinpoint
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          cd /d "${{ env.VCPKG_ROOT }}"
          git checkout 522253caf47268c1724f486a035e927a42a90092
          call bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Ensure vcpkg cache directories exist
        run: |
          New-Item -ItemType Directory -Path "${{ env.VCPKG_ROOT }}/downloads" -Force | Out-Null
          New-Item -ItemType Directory -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" -Force | Out-Null
        shell: pwsh

      - name: Restore vcpkg caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-2022-OpenSSL-${{ env.VCToolsVersion }}-522253caf47268c1724f486a035e927a42a90092-${{ hashFiles('vcpkg.json') }}

      - name: Install Windows OpenSSL Triplet
        run: '"${{env.VCPKG_ROOT}}\vcpkg" install --vcpkg-root "${{env.VCPKG_ROOT}}" --triplet=x64-windows'
        shell: cmd

      - name: Configure CMake (Release - Stripped)
        run: |
          mkdir build-release
          cd build-release
          cmake -S .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_SHARED_LIBS=ON -DENABLE_STEAMDATAGRAMRELAY=OFF -DENABLE_ICE=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF "-DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake" -DUSE_CRYPTO=OpenSSL
        shell: cmd

      - name: Build Windows PC Binary
        working-directory: '${{ github.workspace }}'
        run: cmake --build build-release --config Release
        shell: cmd

      - name: Upload Windows Library
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-pc
          path: |
            build-release/bin/gamenetworkingsockets.dll
            build_release/bin/gamenetworkingsockets.lib
